name: 🚀 Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. PHP ───────────────────────────────────────────
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, xml, bcmath, gd, zip, curl, intl

      # ── 3. Composer ──────────────────────────────────────
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      # ── 4. Build Vue public ───────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build site public (Vue + Inertia)
        run: npm ci && npm run build

      # ── 5. Build Admin React ─────────────────────────────
      - name: Build admin React
        run: cd admin && npm ci && npm run build

      # ── 6. Upload fichiers via SCP ────────────────────────
      # .env est gitignore → ne sera pas uploadé (ne remplace pas le .env serveur)
      # storage/app/public est gitignore → fichiers uploadés préservés
      - name: Upload files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: ${{ secrets.LARAVEL_PATH }}
          overwrite: true
          rm: false

      # ── 7. Post-deploy ────────────────────────────────────
      - name: Post-deploy (assets + migrate + cache)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            LARAVEL="${{ secrets.LARAVEL_PATH }}"
            PUBLIC="${{ secrets.PUBLIC_HTML }}"

            mkdir -p "$PUBLIC"

            # Copier index.php + .htaccess vers public_html
            cp "$LARAVEL/public/index.php" "$PUBLIC/index.php"
            [ -f "$LARAVEL/public/.htaccess" ] && cp "$LARAVEL/public/.htaccess" "$PUBLIC/.htaccess"
            [ -f "$LARAVEL/public/robots.txt" ] && cp "$LARAVEL/public/robots.txt" "$PUBLIC/robots.txt"
            [ -f "$LARAVEL/public/favicon.ico" ] && cp "$LARAVEL/public/favicon.ico" "$PUBLIC/favicon.ico"

            # Assets Vite
            [ -d "$LARAVEL/public/build" ] && rsync -a --delete "$LARAVEL/public/build/" "$PUBLIC/build/"
            [ -d "$LARAVEL/public/admin" ] && rsync -a --delete "$LARAVEL/public/admin/" "$PUBLIC/admin/"

            # Permissions
            chmod -R 775 "$LARAVEL/storage" "$LARAVEL/bootstrap/cache"

            cd "$LARAVEL"

            # Storage symlink
            php8.3 artisan storage:link --force 2>/dev/null || true

            # Migrations
            php8.3 artisan migrate --force

            # Seed admins
            php8.3 artisan db:seed --class=AdminSeeder --force

            # Cache
            php8.3 artisan config:cache
            php8.3 artisan route:cache
            php8.3 artisan view:cache

            echo "✅ NETSPRING déployé avec succès !"
