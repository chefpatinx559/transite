name: 🚀 Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. PHP ───────────────────────────────────────────
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, xml, bcmath, gd, zip, curl, intl

      # ── 3. Composer ──────────────────────────────────────
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      # ── 4. Build Vue public ───────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build site public (Vue + Inertia)
        run: npm ci && npm run build

      # ── 5. Build Admin React ─────────────────────────────
      - name: Build admin React
        run: cd admin && npm ci && npm run build

      # ── 6. Créer archive de déploiement ──────────────────
      - name: Create deployment archive
        run: |
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='.env' \
              --exclude='.claude' \
              --exclude='storage/app/public' \
              --exclude='storage/framework/cache' \
              --exclude='storage/framework/sessions' \
              --exclude='storage/framework/views' \
              --exclude='storage/logs/*.log' \
              --exclude='admin/node_modules' \
              --exclude='node_modules' \
              -czf /tmp/netspring.tar.gz .
          echo "Archive size: $(du -sh /tmp/netspring.tar.gz | cut -f1)"

      # ── 7. Upload archive via SCP ─────────────────────────
      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: /tmp/netspring.tar.gz
          target: /tmp/

      # ── 8. Extraire + post-deploy ─────────────────────────
      - name: Extract & post-deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            LARAVEL="${{ secrets.LARAVEL_PATH }}"
            PUBLIC="${{ secrets.PUBLIC_HTML }}"

            # Extraire l'archive
            mkdir -p "$LARAVEL"
            tar -xzf /tmp/netspring.tar.gz -C "$LARAVEL" --overwrite
            rm -f /tmp/netspring.tar.gz

            # Synchroniser public/ → public_html/
            mkdir -p "$PUBLIC"
            cp "$LARAVEL/public/index.php" "$PUBLIC/index.php"
            cp "$LARAVEL/public/.htaccess" "$PUBLIC/.htaccess" 2>/dev/null || true
            cp "$LARAVEL/public/robots.txt" "$PUBLIC/robots.txt" 2>/dev/null || true
            cp "$LARAVEL/public/favicon.ico" "$PUBLIC/favicon.ico" 2>/dev/null || true

            # Assets build Vite
            [ -d "$LARAVEL/public/build" ] && rsync -a --delete "$LARAVEL/public/build/" "$PUBLIC/build/"
            [ -d "$LARAVEL/public/admin" ] && rsync -a --delete "$LARAVEL/public/admin/" "$PUBLIC/admin/"

            # Permissions
            chmod -R 775 "$LARAVEL/storage"
            chmod -R 775 "$LARAVEL/bootstrap/cache"

            # Storage symlink
            cd "$LARAVEL"
            php8.3 artisan storage:link --force 2>/dev/null || true

            # Migrations + seed admins
            php8.3 artisan migrate --force
            php8.3 artisan db:seed --class=AdminSeeder --force

            # Cache
            php8.3 artisan config:cache
            php8.3 artisan route:cache
            php8.3 artisan view:cache

            echo "✅ Déploiement NETSPRING terminé !"
